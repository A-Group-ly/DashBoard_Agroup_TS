name: CI / CD

# Pull requests: typecheck, lint, unit tests and a production build.
# Push to main (or "Run workflow"): the same checks, then deploy to Cloudflare.
#
# GitHub secrets needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard -> Workers & Pages -> Account ID
# Nothing else: the Clerk key, database URL etc. live in the worker's own
# settings on Cloudflare, and the page reads the Clerk key from /api/config.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Optional repository variable; falls back to the current live address.
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://agroup-dashboard.agroup-dashboard-ly-2026.workers.dev' }}

jobs:
  check:
    name: Build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the worker bundles (no upload)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Secrets pasted from a browser often carry a hidden space or line
          # break, which Cloudflare rejects. Strip all whitespace first.
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          ACCOUNT_ID="$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is empty or not set in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_ACCOUNT_ID is empty or not set."
            exit 1
          fi
          if ! printf '%s' "$ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error title=Wrong account ID format::CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID (letters a-f and digits). It is ${#ACCOUNT_ID} characters long. Copy it from Cloudflare -> Workers & Pages -> Account details -> Account ID (not the Zone ID, not your email)."
            exit 1
          fi

          api() { curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          explain() { echo "$1" | jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")'; }

          # 1. Is the token itself valid? (user tokens and account tokens verify differently)
          VERIFY="$(api /user/tokens/verify)"
          if [ "$(echo "$VERIFY" | jq -r '.success')" != "true" ]; then
            VERIFY="$(api "/accounts/$ACCOUNT_ID/tokens/verify")"
          fi
          if [ "$(echo "$VERIFY" | jq -r '.success')" != "true" ] || [ "$(echo "$VERIFY" | jq -r '.result.status')" != "active" ]; then
            echo "::error title=Cloudflare API token rejected::The token is invalid, expired or disabled ($(explain "$VERIFY")). Create a new one: Cloudflare -> My Profile -> API Tokens -> Create Token -> template 'Edit Cloudflare Workers', then paste it into the CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          echo "✓ API token is valid and active"

          # 2. Can it manage Workers in this account?
          SCRIPTS="$(api "/accounts/$ACCOUNT_ID/workers/scripts")"
          if [ "$(echo "$SCRIPTS" | jq -r '.success')" != "true" ]; then
            ACCOUNT="$(api "/accounts/$ACCOUNT_ID")"
            if [ "$(echo "$ACCOUNT" | jq -r '.success')" != "true" ]; then
              echo "::error title=Token cannot access this account::The token is valid but cannot see account $ACCOUNT_ID ($(explain "$SCRIPTS")). Either CLOUDFLARE_ACCOUNT_ID is from a different Cloudflare account than the token, or the token's 'Account Resources' does not include this account."
            else
              echo "::error title=Missing Workers permission::The token can see account '$(echo "$ACCOUNT" | jq -r '.result.name')' but cannot manage Workers ($(explain "$SCRIPTS")). Give it 'Account -> Workers Scripts -> Edit' (the 'Edit Cloudflare Workers' template includes it)."
            fi
            exit 1
          fi
          echo "✓ Token can manage Workers in this account ($(echo "$SCRIPTS" | jq -r '.result | length') workers found)"

          # 4. Is the workers.dev subdomain set up?
          SUBDOMAIN="$(api "/accounts/$ACCOUNT_ID/workers/subdomain")"
          if [ "$(echo "$SUBDOMAIN" | jq -r '.success')" != "true" ]; then
            echo "::warning title=workers.dev subdomain::Could not read the workers.dev subdomain ($(explain "$SUBDOMAIN")). If the deploy fails, open Workers & Pages once in the Cloudflare dashboard to create it."
          else
            echo "✓ workers.dev subdomain: $(echo "$SUBDOMAIN" | jq -r '.result.subdomain').workers.dev"
          fi

          # Hand the cleaned values to the next step.
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy worker + assets
        run: npx wrangler deploy

      - name: Smoke test the live site
        run: |
          sleep 5
          echo "Checking $PRODUCTION_URL"

          health="$(curl -sS --max-time 20 "$PRODUCTION_URL/api/health" || true)"
          echo "/api/health -> $health"
          echo "$health" | jq -e '.ok == true' > /dev/null || {
            echo "::error title=Health check failed::$PRODUCTION_URL/api/health did not answer ok. Check the worker's DATABASE_URL secret in Cloudflare."
            exit 1
          }

          config="$(curl -sS --max-time 20 "$PRODUCTION_URL/api/config" || true)"
          echo "$config" | jq -e '.clerkPublishableKey | startswith("pk_")' > /dev/null || {
            echo "::error title=Clerk key missing::$PRODUCTION_URL/api/config has no Clerk key. Add CLERK_PUBLISHABLE_KEY to the worker: npx wrangler secret put CLERK_PUBLISHABLE_KEY"
            exit 1
          }
          echo "/api/config -> Clerk key present"

          status="$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$PRODUCTION_URL/api/me")"
          echo "/api/me without signing in -> $status"
          test "$status" = "401" || {
            echo "::error title=Protection check failed::Expected 401 from /api/me for anonymous visitors, got $status."
            exit 1
          }
          echo "✓ Live site is up and protected"
